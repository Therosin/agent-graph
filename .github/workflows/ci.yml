name: Tests, builds, and releases

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.2
  NODE_VERSION: '24'

jobs:
  checks:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check types and components
        run: bun run check
      - name: Unit and worker tests
        run: bun run test
      - name: Install browser
        if: runner.os == 'Linux'
        run: bunx --no-install playwright install --with-deps chromium
      - name: Browser integration tests
        env:
          PLAYWRIGHT_CHANNEL: ${{ runner.os == 'Windows' && 'msedge' || '' }}
        run: bun run test:e2e
      - name: Keep test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: .logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package (${{ matrix.target }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: bun-windows-x64
          - os: ubuntu-24.04
            target: bun-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libnotify-bin zenity libayatana-appindicator3-1 wl-clipboard xsel xdg-utils libglib2.0-bin xvfb xauth dbus-x11 dunst python3-dbus python3-gi
      - name: Ensure Windows WebView2 Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtimeKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          function Get-WebViewVersion {
            Get-ItemProperty -Path $runtimeKeys -Name pv -ErrorAction SilentlyContinue |
              Where-Object { $_.pv -and [version]$_.pv -gt [version]'0.0.0.0' } |
              Select-Object -ExpandProperty pv -First 1
          }
          if (-not (Get-WebViewVersion)) {
            $webviewInstaller = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $webviewInstaller
            $webviewInstallerProcess = Start-Process -FilePath $webviewInstaller -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($webviewInstallerProcess.ExitCode -ne 0) { throw "WebView2 installer exited with $($webviewInstallerProcess.ExitCode)" }
          }
          if (-not (Get-WebViewVersion)) { throw 'WebView2 Runtime is not installed' }
          Write-Output "WebView2 Runtime: $(Get-WebViewVersion)"
      - name: Build and test relocated Windows package
        if: runner.os == 'Windows'
        run: bun run test:package --target=${{ matrix.target }} --offline
      - name: Build and test relocated Linux package and tray menu
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          NATIVE_TRAY_TEST_HOST: '1'
        run: xvfb-run -a -s '-screen 0 1280x900x24' bun run test:package --target=${{ matrix.target }} --offline
      - name: Create release archive and checksum
        run: bun scripts/package-release.ts --target=${{ matrix.target }}
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: build/releases/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    needs: [checks, package]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: build/releases
      - name: Verify archives and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat build/releases/*.sha256 > build/releases/SHA256SUMS.txt
          (cd build/releases && sha256sum --check SHA256SUMS.txt)
          app_name=$(bun -e 'import { AppConfig } from "./packages/config/config.ts"; console.log(AppConfig.appName)')
          app_version=$(bun -e 'import { AppConfig } from "./packages/config/config.ts"; console.log(AppConfig.appVersion)')
          channel=build
          flags=(--prerelease=false --latest)
          if [[ "$GITHUB_REF_NAME" == develop ]]; then
            channel=testing
            flags=(--prerelease --latest=false)
          fi
          tag="$channel-$GITHUB_RUN_NUMBER-${GITHUB_SHA:0:7}"
          title="$app_name $app_version ($channel $GITHUB_RUN_NUMBER)"
          printf '%s\n' "$title" '' "Commit: $GITHUB_SHA" "Branch: $GITHUB_REF_NAME" "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '' 'Extract the complete archive and keep its native directories beside the executable.' 'See docs/Packaging.md for platform dependencies.' > "$RUNNER_TEMP/release-notes.md"
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$state" == false ]]; then
            echo "Release $tag is already published."
            exit 0
          fi
          if [[ "$state" != true ]]; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md" --latest=false
          fi
          gh release upload "$tag" build/releases/*.zip build/releases/*.tar.gz build/releases/SHA256SUMS.txt --clobber
          gh release edit "$tag" --draft=false "${flags[@]}"
